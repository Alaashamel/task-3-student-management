<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        
        <div class="form-section">
            <h2>Add Student</h2>
            <div class="form-group">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" placeholder="Enter student name">
            </div>
            <div class="form-group">
                <label for="studentAge">Student Age:</label>
                <input type="number" id="studentAge" placeholder="Enter student age">
            </div>
            <div class="form-group">
                <label for="studentGrade">Student Grade:</label>
                <input type="number" id="studentGrade" placeholder="Enter student grade">
            </div>
            
            <div class="button-group">
                <button id="addStudentBtn">Add Student</button>
                <button id="showStudentsBtn">Show Students</button>
                <button id="searchStudentBtn">Search Student</button>
                <button id="deleteStudentBtn">Delete Student</button>
            </div>
        </div>

        <div class="output-section">
            <h2>Output</h2>
            <p id="studentCount">Total Students: 0</p>
            <div id="output"></div>
        </div>
    </div>

    <script src="src/js/app.js"></script>
</body>
</html>
